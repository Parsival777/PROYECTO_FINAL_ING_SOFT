<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaga Web SaaS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Estilos de las Interfaces de Usuario */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px #00ffff;
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        .screen.active {
            display: flex;
        }

        h1, h2, h3 { color: #00ffff; text-shadow: 2px 2px #0000ff; }
        
        input {
            margin: 10px 0;
            padding: 15px;
            width: 250px;
            background: #000;
            border: 2px solid #00ffff;
            color: #00ffff;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            text-align: center;
        }

        button {
            margin: 10px 5px;
            padding: 15px 20px;
            background: #000;
            border: 2px solid #00ffff;
            color: #00ffff;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #00ffff; color: #000; }
        button.btn-alt { border-color: #ff00ff; color: #ff00ff; }
        button.btn-alt:hover { background: #ff00ff; color: #000; }
        button.btn-danger { border-color: #ff0000; color: #ff0000; }
        button.btn-danger:hover { background: #ff0000; color: #000; }

        /* Estilos de la Tienda */
        #shop-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: #111;
            border: 2px solid #555;
            padding: 20px;
            border-radius: 10px;
            width: 200px;
            text-align: center;
        }
        .card img { width: 80px; height: 80px; image-rendering: pixelated; margin-bottom: 10px; }
        .card.common { border-color: #aaaaaa; }
        .card.epic { border-color: #aa00ff; box-shadow: 0 0 10px #aa00ff; }
        .card.legendary { border-color: #ffaa00; box-shadow: 0 0 15px #ffaa00; }
        .card.equipped { border-color: #00ff00; box-shadow: 0 0 20px #00ff00; }

        /* Contenedor del Juego y HUD */
        #game-wrapper {
            display: none;
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid #555;
            background: #000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
            pointer-events: none;
            font-size: 16px;
            text-shadow: 2px 2px #000;
        }
        #lives-container { display: flex; gap: 5px; align-items: center; }
        canvas { display: block; }
    </style>
</head>
<body>

    <!-- PANTALLA 1: AUTENTICACIÓN -->
    <div id="auth-screen" class="screen active">
        <h1>GALAGA ONLINE</h1>
        <p>Ingresa tus coordenadas, piloto</p>
        <input type="text" id="username" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <div>
            <button id="btn-login">Iniciar Sesión</button>
            <button id="btn-register" class="btn-alt">Registrarse</button>
        </div>
        <button id="btn-guest">Jugar como Invitado</button>
        <p id="auth-msg"></p>
    </div>

    <!-- PANTALLA 2: LOBBY -->
    <div id="lobby-screen" class="screen">
        <h2>LOBBY PRINCIPAL</h2>
        <p id="lobby-user">Piloto: ---</p>
        <p id="lobby-coins">Billetera: --- 🪙</p>
        <p id="lobby-skin">Nave Actual: ---</p>
        <button id="btn-play">🕹️ DESPEGAR</button>
        <button id="btn-shop" class="btn-alt">🛒 TIENDA / LOCKER</button>
        <button id="btn-logout" class="btn-danger">Cerrar Sesión</button>
    </div>

    <!-- PANTALLA 3: TIENDA / LOCKER -->
    <div id="shop-screen" class="screen">
        <h2 id="shop-title">🏪 TIENDA INTERGALÁCTICA 🏪</h2>
        <p id="shop-coins">Tus Monedas: --- 🪙</p>
        <button id="btn-toggle-shop" class="btn-alt">Ir al Locker</button>
        <div id="shop-container"></div>
        <p id="shop-msg"></p>
        <button id="btn-back-lobby">Volver al Lobby</button>
    </div>

    <!-- PANTALLA 4: GAME OVER Y LEADERBOARD -->
    <div id="gameover-screen" class="screen">
        <h2 style="color: #ff0000;">GAME OVER</h2>
        <p id="go-score">Puntuación: 0</p>
        <p id="go-coins" style="color: #00ff00;">+ 0 🪙</p>
        <h3>TOP PILOTOS</h3>
        <div id="leaderboard-list" style="font-size: 12px; text-align: left; margin: 20px auto; width: 300px; line-height: 1.8;"></div>
        <button id="btn-return-lobby">Volver al Menú</button>
    </div>

    <!-- CONTENEDOR DEL JUEGO UNIFICADO -->
    <div id="game-wrapper">
        <!-- HUD ANCLADO AL CANVAS -->
        <div id="hud">
            <div class="lives" id="lives-container"></div>
            <div id="score-display">SCORE: 0</div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
