version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: galaga_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: galaga_db
      MYSQL_USER: galaga_user
      MYSQL_PASSWORD: galaga_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Si guardas tu script de SQL como init.sql en la raíz, 
      # descomenta la siguiente línea para que las tablas se creen solas:
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./api_server
    container_name: galaga_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=galaga_user
      - DB_PASSWORD=galaga_password
      - DB_NAME=galaga_db
      - PORT=3000
    depends_on:
      - db

volumes:
  db_data: